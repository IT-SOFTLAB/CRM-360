version: "3.8"

services:
  backend:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_ECR_REPOSITORY}:${BACKEND_TAG}"

    ports:
      - "${HOST_BACKEND_PORT}:5000"

    env_file:
      - ../backend/.env

    environment:
      NODE_ENV: production
      PORT: 5000

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(5000, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: always

  frontend:
    image: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_ECR_REPOSITORY}:${FRONTEND_TAG}"

    ports:
      - "${HOST_FRONTEND_PORT}:3000"

    env_file:
      - ../frontend/.env

    environment:
      NODE_ENV: production
      PORT: 3000

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000, '127.0.0.1').on('connect', function(){process.exit(0)}).on('error', function(){process.exit(1)})"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: always

