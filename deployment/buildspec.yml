version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "ap-south-1"

    # ECR repositories
    IMAGE_REPO_NAME_BACKEND: "crm-backend"
    IMAGE_REPO_NAME_FRONTEND: "crm-frontend"

    
    S3_ENV_BUCKET: "secure-env-files-itsoftlab"

    
    FRONTEND_ENV_S3_KEY: "crm/frontend.env"
    BACKEND_ENV_S3_KEY: "crm/backend.env"


phases:

  install:
    runtime-versions:
      nodejs: 20

    commands:
      - echo "=========================================="
      - echo "Installing / verifying build environment"
      - echo "=========================================="

      - node --version
      - npm --version
      - docker --version
      - aws --version


  pre_build:
    commands:
      - echo "=========================================="
      - echo "Preparing build"
      - echo "=========================================="

      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "AWS Account ID: $AWS_ACCOUNT_ID"
      - echo "AWS Region: $AWS_DEFAULT_REGION"

      - ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - echo "ECR Registry: $ECR_REGISTRY"

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - COMMIT_HASH=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)
      - IMAGE_TAG="${COMMIT_HASH:-latest}"

      - echo "Image Tag: $IMAGE_TAG"

      - echo "Downloading frontend environment file from S3..."
      - aws s3 cp "s3://$S3_ENV_BUCKET/$FRONTEND_ENV_S3_KEY" "./frontend/.env"

      - echo "Frontend environment file downloaded successfully."

      # Backend environment file
      - echo "Downloading backend environment file from S3..."
      - aws s3 cp "s3://$S3_ENV_BUCKET/$BACKEND_ENV_S3_KEY" "./backend/.env"

      - echo "Backend environment file downloaded successfully."

  build:
    commands:

      - echo "=========================================="
      - echo "Building CRM Backend Docker image"
      - echo "=========================================="

      - docker build -t "$IMAGE_REPO_NAME_BACKEND:$IMAGE_TAG" ./backend

      - docker tag \
          "$IMAGE_REPO_NAME_BACKEND:$IMAGE_TAG" \
          "$ECR_REGISTRY/$IMAGE_REPO_NAME_BACKEND:$IMAGE_TAG"

      - docker tag \
          "$IMAGE_REPO_NAME_BACKEND:$IMAGE_TAG" \
          "$ECR_REGISTRY/$IMAGE_REPO_NAME_BACKEND:latest"

      - echo "=========================================="
      - echo "Building CRM Frontend Docker image"
      - echo "=========================================="

      - docker build \
          -t "$IMAGE_REPO_NAME_FRONTEND:$IMAGE_TAG" \
          ./frontend

      - docker tag \
          "$IMAGE_REPO_NAME_FRONTEND:$IMAGE_TAG" \
          "$ECR_REGISTRY/$IMAGE_REPO_NAME_FRONTEND:$IMAGE_TAG"

      - docker tag \
          "$IMAGE_REPO_NAME_FRONTEND:$IMAGE_TAG" \
          "$ECR_REGISTRY/$IMAGE_REPO_NAME_FRONTEND:latest"

  post_build:
    commands:

      - echo "=========================================="
      - echo "Pushing CRM Backend image to ECR"
      - echo "=========================================="

      - docker push \
          "$ECR_REGISTRY/$IMAGE_REPO_NAME_BACKEND:$IMAGE_TAG"

      - docker push \
          "$ECR_REGISTRY/$IMAGE_REPO_NAME_BACKEND:latest"


      - echo "=========================================="
      - echo "Pushing CRM Frontend image to ECR"
      - echo "=========================================="

      - docker push \
          "$ECR_REGISTRY/$IMAGE_REPO_NAME_FRONTEND:$IMAGE_TAG"

      - docker push \
          "$ECR_REGISTRY/$IMAGE_REPO_NAME_FRONTEND:latest"

      - echo "=========================================="
      - echo "Generating imagedefinitions.json"
      - echo "=========================================="

      - |
        printf '[
          {
            "name": "backend",
            "imageUri": "%s"
          },
          {
            "name": "frontend",
            "imageUri": "%s"
          }
        ]' \
        "$ECR_REGISTRY/$IMAGE_REPO_NAME_BACKEND:$IMAGE_TAG" \
        "$ECR_REGISTRY/$IMAGE_REPO_NAME_FRONTEND:$IMAGE_TAG" \
        > imagedefinitions.json

      - echo "Generated imagedefinitions.json:"
      - cat imagedefinitions.json

      - echo "=========================================="
      - echo "CRM Docker build completed successfully"
      - echo "=========================================="


artifacts:
  files:
    - imagedefinitions.json